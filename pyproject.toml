[project]
name = "telegram-news-classifier"
version = "1.0.2"
description = "A bot for Telegram that analyzes and classifies news using a pre-trained RuBERT model, simplifying news management in Telegram channels."
authors = [{ name = "NKTKLN", email = "nktkln@nktkln.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "telethon>=1.38.1,<2.0.0",
  "torch>=2.6.0,<3.0.0",
  "transformers>=4.48.0,<5.0.0",
  "spacy>=3.8.3,<4.0.0",
  "duckdb>=1.1.3,<2.0.0",
  "apscheduler>=3.11.0,<4.0.0",
  "pydantic>=2.11.7,<3.0.0",
  "pydantic-settings>=2.9.1,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "loguru>=0.7.3,<0.8.0",
]

[dependency-groups]
dev = [
  "ruff>=0.15.1",
  "mypy>=1.19.1",
  "pre-commit>=4.5.1",
  "pip-audit>=2.10.0",
  "deptry>=0.24.0",
  "commitizen>=4.13.7",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_classifier"]

[tool.hatch.build.targets.sdist]
include = ["src/news_classifier", "README.md", "pyproject.toml"]

[tool.hatch.build]
exclude = [
  "/.github",
  "/.claude",
  "/.codex",
  "/.venv",
  "/data",
  "/notebooks",
  "/tmp",
  "/dist",
  "/build",
  "**/__pycache__",
  "**/*.pyc",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-include = ["*.ipynb"]
exclude = [".git", ".claude", ".codex", "__pycache__", "build", "dist", ".venv", "tmp", "notebooks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "B", "B9", "C90", "S", "UP", "SIM", "TRY", "PL", "RUF", "ARG", "PTH"]
# RUF001-003: the bot works on Russian text, so Cyrillic in strings, comments
# and docstrings is the norm rather than a lookalike typo.
# TRY003: the messages here name the offending path, which is the whole value
# of the exception; a class per message would say less.
ignore = ["E203", "D100", "RUF001", "RUF002", "RUF003", "TRY003"]
fixable = ["ALL"]

[tool.ruff.lint.pylint]
# MessageHandler takes its six collaborators through the constructor; the
# alternative is a service locator, which hides the same six.
max-args = 6
max-positional-args = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"utils/**.py" = ["T201"]                  # print in the standalone exporter

[tool.mypy]
# The pydantic plugin teaches mypy that BaseSettings fields come from the
# environment, so AppSettings() is a complete call with no arguments.
plugins = ["pydantic.mypy"]
mypy_path = ["src"]
files = ["src", "utils"]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
disallow_untyped_calls = true
exclude = [".git", ".claude", ".codex", "__pycache__", "build", "dist", ".venv", "tmp", "notebooks"]

# Telethon, transformers, spaCy and APScheduler ship no type information, so
# every value crossing their boundary is Any; disallow_any_unimported is left
# off for that reason rather than because strictness is unwanted.
[[tool.mypy.overrides]]
module = ["telethon.*", "transformers.*", "spacy.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.deptry]
known_first_party = ["news_classifier"]
extend_exclude = ["\\.claude", "\\.codex", "notebooks", "utils"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = false
